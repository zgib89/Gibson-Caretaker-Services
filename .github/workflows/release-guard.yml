name: Release Guard

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_postdeploy:
        description: "Run live post-deploy parity check"
        required: false
        default: "false"

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release profile preflight
        run: npm run verify:preflight

  postdeploy-parity:
    if: github.event_name == 'workflow_dispatch' && inputs.run_postdeploy == 'true'
    runs-on: ubuntu-latest
    needs: preflight
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify live post-deploy parity
        run: npm run verify:postdeploy
